<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" media="(min-width: 900px)">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5"><meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Material ro'yxati — Thermo</title><style>:root{--acc:#2b6cb0;--acc-d:#2c5282;--acc-t:#e8f0f8;--bg:#f5f5f5;--panel:#ffffff;--txt:#1f1f1f;--mut:#616161;--line:#e0e0e0;--bad:#b33a3a;--warn:#b26a00;--warn-t:#fff6e5;--ok:#1d8a4a;--ok-t:#e9f7ef;--r:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--acc:#3d78b8;--acc-d:#2b6cb0;--bg:#1b1b1d;--panel:#242427;--txt:#ececee;--mut:#a1a1aa;--line:#34343a;--acc-t:#1f2c3a;--bad:#e07272;--warn:#f0b14a;--warn-t:#33270f;--ok:#4cc17c;--ok-t:#12301f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.35}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 170px}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;font-weight:800;display:grid;place-items:center;font-size:18px;flex:none}
.top h1{font-size:19px;margin:0;line-height:1.15}
.top .s{font-size:12.5px;color:var(--mut)}
.lang{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:7px 10px;font-size:13px;font-weight:700;color:var(--mut)}
.lang button.on{background:var(--txt);color:var(--panel)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.lbl{font-size:12.5px;color:var(--mut);margin:0 0 5px;font-weight:600}
.inp{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:11px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--acc)}
.inp.bad{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.who{display:flex;align-items:center;gap:10px}
.who b{font-size:15px}
.who .ph{color:var(--mut);font-size:14px}
.link{border:0;background:none;color:var(--acc);font-weight:600;padding:4px 0;margin-left:auto;font-size:14px}
.row{display:flex;align-items:center;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:active{background:var(--acc-d)}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:13px}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5}
.tools{display:flex;gap:8px;margin:4px 0 10px;flex-wrap:wrap}
.tools .btn{flex:1;min-width:130px}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.empty b{display:block;color:var(--txt);margin-bottom:6px;font-size:16px}
.ln{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 12px;margin-bottom:8px}
.ln.unk{border-color:var(--warn);background:var(--warn-t)}
.ln.fresh{animation:fr 1.2s ease}
@keyframes fr{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.ln .n{color:var(--mut);font-size:13px;width:20px;text-align:right;flex:none}
.ln .t{flex:1;min-width:0}
.ln .nm{font-weight:650;font-size:15.5px;word-break:break-word}
.ln .ch{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:12.5px;padding:2px 7px;border-radius:7px;background:var(--bg);color:var(--txt);font-weight:600}
.tag.sz{background:var(--acc-t);color:var(--acc)}
.tag.w{background:transparent;color:var(--warn);padding-left:0}
.qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;flex:none;background:var(--panel)}
.qty button{border:0;background:transparent;width:34px;height:38px;font-size:20px;font-weight:600;color:var(--mut)}
.qty .v{min-width:46px;text-align:center;font-weight:700;font-size:15px;padding:0 2px}
.qty .v small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:-2px}
.qty.none{border-color:var(--warn)}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 18px);padding:14px 0 calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:640px;margin:0 auto;padding:0 12px}
.sug{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.12);max-height:46vh;overflow-y:auto;overscroll-behavior:contain}
.sug:empty{display:none}
.sg{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 12px}
.sg:last-child{border-bottom:0}
.sg.top{background:var(--acc-t)}
.sg .nm{font-weight:650;flex:1}
.sg .nm em{font-style:normal;color:var(--acc)}
.sg .q{font-size:13px;color:var(--mut);font-weight:600;flex:none}
.words{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.words button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:14px;white-space:nowrap}
.compose{display:flex;gap:8px}
.compose .inp{flex:1;font-size:16px;padding:13px 14px;border-radius:13px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.compose .btn{border-radius:13px;width:52px;padding:0;font-size:26px}
.sendbar{margin-top:8px}
.sheet-bg{position:fixed;inset:0;overscroll-behavior:contain;touch-action:none;background:rgba(0,0,0,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;animation:up .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .d{color:var(--mut);font-size:14px;margin-bottom:12px}
.grp{margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;min-width:46px}
.chip.on{border-color:var(--acc);background:var(--acc-t);color:var(--acc)}
.qbig{display:flex;align-items:center;gap:10px;margin-top:4px}
.qbig button{width:52px;height:52px;border-radius:13px;border:1.5px solid var(--line);background:var(--panel);font-size:26px;font-weight:600}
.qbig input{width:110px;text-align:center;font-size:22px;font-weight:700;padding:10px}
.qbig .u{color:var(--mut);font-weight:600}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
.cat{display:flex;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 4px;text-align:left;font-size:16px;font-weight:600}
.cat span{margin-left:auto;color:var(--mut)}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-t);color:var(--ok);display:grid;place-items:center;font-size:34px;margin:6px auto 10px}
.center{text-align:center}
.num{font-size:30px;font-weight:800;margin:2px 0 10px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--txt);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;font-size:14px;max-width:90vw;text-align:center}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px}
.hist{border-top:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:10px}
.hist .t{flex:1;font-size:14px}
.hist .t b{display:block;font-size:15px}
textarea.inp{min-height:180px;resize:vertical}
.muted{color:var(--mut);font-size:13px}
.vis{display:none}
body.lock{overflow:hidden}

/* bo'limlar, «Jami», hisoblash, shaxsiy havola */
.secbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.secbar .chips{flex:1;min-width:0}
.secbar .chip{padding:7px 11px;font-size:14px}
.chip.add{border-style:dashed;color:var(--mut)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--panel);padding:7px 11px;font-size:14px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.sechd{display:flex;align-items:center;gap:8px;margin:14px 2px 6px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);cursor:pointer}
.sechd span{font-weight:700;color:var(--mut);opacity:.8}
.sechd.on{color:var(--acc)}
.sechd.tot{cursor:default;color:var(--txt);text-transform:none;letter-spacing:0;font-size:14.5px}
.secempty{color:var(--mut);font-size:13.5px;padding:4px 4px 8px}
.ln.ro .qty{border-style:dashed}
.qty .v .ex{display:block;font-size:10px;color:var(--acc);font-weight:600;margin-top:1px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl .hint{font-weight:500;color:var(--mut);opacity:.85;font-size:12px}
.calcres{margin-top:6px;font-size:18px;font-weight:800;color:var(--acc);min-height:22px}
.tag.ok{background:var(--ok-t);color:var(--ok);flex:none}
.keybad{background:var(--warn-t);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.ghost{border-color:transparent;color:var(--mut);padding:7px 9px}

/* ===== kompyuter (≥900px): programmadagi «Новая заявка → Подбор товаров» kabi ===== */
body.desk{font-size:14px;letter-spacing:-.003em}
body.desk .dk{min-height:100vh}
.dh{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:color-mix(in srgb,var(--panel) 85%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.dlogo{font-weight:800;letter-spacing:.06em;font-size:14px;white-space:nowrap}
.dlogo span{color:var(--acc);margin:0 2px}
.dtt{color:var(--mut);font-weight:600;font-size:13px;padding-left:14px;border-left:1px solid var(--line);margin-right:auto}
.dwho{display:flex;align-items:center;gap:8px;font-size:13px}
.dwho .dwn{font-weight:650}
.dwho .xs{color:var(--mut)}
.dwho .link{margin:0;font-size:13px}
body.desk .lang{border-radius:6px;margin-left:0}
body.desk .lang button{padding:5px 10px}
.dbody{padding:22px 28px 40px}
.dph{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dph h2{margin:0 auto 0 0;font-size:22px;font-weight:700}
body.desk .inp{border-radius:6px;border-width:1px;padding:8px 11px;font-size:14px;height:36px}
body.desk .inp:focus{border-color:var(--mut)}
body.desk .inp.bad{border-color:var(--bad)}
body.desk .btn{border-radius:6px;border-width:1px;padding:0 14px;height:36px;font-size:14px;font-weight:600}
body.desk .btn:active{transform:translateY(1px)}
body.desk .btn:hover{border-color:var(--mut)}
body.desk .btn.pri:hover{border-color:var(--acc-d);background:var(--acc-d)}
body.desk .btn.xs{height:auto;padding:4px 9px;font-size:12px}
body.desk .btn.dng{color:var(--bad)}
body.desk .btn.dng:hover{border-color:var(--bad)}
body.desk .btn:disabled{opacity:.45;cursor:default;transform:none}
body.desk .card{border-radius:8px;padding:16px;margin-bottom:14px;border-color:var(--line);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12px;color:var(--mut);font-weight:600}
.dpickh{margin-bottom:12px}
.dpickh h3{margin:0 auto 0 0;font-size:16px}
body.desk .secbar{margin:0 0 10px}
body.desk .chip{border-radius:6px;border-width:1px;padding:5px 10px;font-size:13px;min-width:0}
body.desk .chip.on{border-color:var(--mut);background:var(--bg);color:var(--txt)}
body.desk .seg{border-radius:6px;border-width:1px}
body.desk .seg button{padding:5px 10px;font-size:13px}
.dsrch{position:relative;margin-bottom:12px}
.dsrch .inp{width:100%}
.dsug{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:15;margin:0!important;border-radius:8px!important;max-height:430px;box-shadow:0 0 0 1px rgba(16,24,40,.04),0 4px 10px rgba(16,24,40,.06),0 28px 64px -18px rgba(16,24,40,.30)!important}
.dsrch:not(:focus-within) .dsug{display:none}
.fhd{padding:8px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.fr{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr b{font-weight:650;font-size:14px}
.fr .sub{font-size:12px;color:var(--mut);margin-top:2px}
.fr.on{background:var(--acc-t)}
.fr.free b{font-weight:500}
.fpend{padding:12px 14px}
.fpend .res{color:var(--acc);margin-left:4px}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.sub.w{color:var(--warn)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{background:var(--panel);color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.045em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.dt td{padding:9px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent);vertical-align:middle}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tr.ln:hover td{background:rgba(127,127,127,.04)}
table.dt .c-n{width:44px;color:var(--mut)}
table.dt .c-q{width:200px}
table.dt .c-u{width:70px;color:var(--mut)}
table.dt .c-x{width:52px;text-align:right}
table.dt td.t{cursor:pointer}
table.dt td.t .nm{font-weight:600;font-size:14px}
table.dt tr.ro td.t{cursor:default}
table.dt tr.unk td{background:var(--warn-t)}
table.dt tr.ln.fresh td{animation:frd 1.4s ease}
@keyframes frd{0%{background:var(--acc-t)}100%{background:transparent}}
.dq{display:flex;align-items:center;gap:8px}
.qin{width:110px!important;font-weight:700}
.qin.none{border-color:var(--bad)!important}
.dq .res{color:var(--acc);font-weight:700;white-space:nowrap}
table.dt tr.sechd td{background:var(--bg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);cursor:pointer;padding:7px 12px}
table.dt tr.sechd.on td{color:var(--txt)}
table.dt tr.sechd span{font-weight:600;opacity:.8;margin-left:4px}
table.dt tr.secempty td{color:var(--mut);font-size:13px}
.dtot{font-weight:600;font-size:13px;color:var(--mut);margin:0 0 8px}
.dempty{border:1px solid var(--line);border-radius:8px;text-align:center;color:var(--mut);padding:30px 16px}
#list .dt{border:1px solid var(--line);border-radius:8px;border-collapse:separate;border-spacing:0;overflow:hidden}
.dfoot{margin-top:12px;justify-content:space-between}
.dcount{font-variant-numeric:tabular-nums}
.dact{margin-top:16px;justify-content:space-between}
body.desk .sheet-bg{align-items:center}
body.desk .sheet{border-radius:10px;max-width:560px;max-height:84vh;padding:20px 22px;animation:none}
body.desk .sheet .qbig button{width:40px;height:40px;border-radius:6px;font-size:20px}
body.desk .sheet .qbig input{width:130px;font-size:18px!important;height:40px}
body.desk .sheet .chip{padding:6px 11px}
body.desk .hist .btn{height:30px;padding:0 10px}
body.desk .toast{top:auto;bottom:24px;border-radius:8px}
@media (min-width:900px) and (max-width:1100px){.dbody{padding:18px 18px 30px}.dh{padding:12px 18px}}
.link.mutl{color:var(--mut);font-weight:500}.link.mutl:hover{color:var(--bad)}
table.dt tr.ln{display:table-row;border:0;border-radius:0;background:none;padding:0;margin:0;gap:0;animation:none}
table.dt tr.ln td{background:var(--panel)}
table.dt tr.ln.unk td{background:var(--warn-t)}
table.dt tr.ln .t{display:table-cell;flex:none;min-width:240px}
table.dt tr.ln .n{width:auto;text-align:left}
.pvbar{position:sticky;top:0;z-index:40;background:var(--warn-t);color:var(--warn);border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,transparent);text-align:center;font-size:13px;font-weight:650;padding:8px 12px}
body.desk .pvbar~.dk .dh{top:34px}

/* qidiruv ro'yxati — programmadagi ProductPicker bilan bir xil */
body.desk{font-family:'Onest',var(--sans)}
body.desk .dsug{top:105%;border:1px solid var(--line);border-radius:10px!important;background:var(--panel);max-height:none;overflow:hidden;box-shadow:0 16px 44px rgba(0,0,0,.18),0 0 0 1px rgba(37,99,235,.15)!important;padding:0}
.phd{display:flex;justify-content:space-between;padding:6px 11px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
.plist{overflow:auto;overscroll-behavior:contain}
.pinner{position:relative}
.prow{position:absolute;left:0;right:0;height:68px;box-sizing:border-box;padding:7px 11px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel)}
.prow:hover,.prow.on{background:var(--acc-tint)}
.pick-name{font-weight:600;font-size:13px;line-height:17px;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.psub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;margin-top:2px}
body.desk .fpend{padding:12px 14px}
.pnm{font-weight:700;font-size:13px;margin-bottom:8px}
.pl{font-size:13px;color:var(--mut);white-space:nowrap}
.ph2{font-size:12px;color:var(--mut);margin-top:6px}
:root{--acc-tint:rgba(43,108,176,.08)}
@media (prefers-color-scheme:dark){:root{--acc-tint:rgba(61,120,184,.14)}}

/* postavshik filtri — programmadagi SupBrandFilter kabi */
.srow{display:flex;gap:6px}
.srow #q{flex:1 1 180px;min-width:0}
.supf{position:relative;flex:0 0 auto}
.sup-filter{width:210px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--panel);color:var(--txt);font:inherit}
.sup-filter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup-filter.on{border-color:var(--acc)!important}
.sup-pop{position:absolute;top:105%;left:0;width:290px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 44px rgba(0,0,0,.2);padding:8px}
.sup-pop .inp{width:100%;margin-bottom:6px}
.sup-list{max-height:300px;overflow:auto;overscroll-behavior:contain}
.pick-sup{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:13px}
.pick-sup.sel{background:var(--acc-tint)}
.pick-sup.sel .sn{font-weight:700}
.pick-sup.hov{outline:1px solid var(--acc);outline-offset:-1px}
.pick-sup .sn{flex:1;font-weight:500;min-width:0}
.pick-sup .sb{color:var(--acc);font-weight:600;font-size:12px}
.pick-sup input{margin:0;accent-color:var(--acc)}
.brand-fly{position:absolute;top:0;left:calc(100% + 6px);width:240px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 16px 44px rgba(0,0,0,.2);padding:8px;z-index:31}
.bfh{font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px}
.bfl{max-height:300px;overflow:auto;overscroll-behavior:contain}
.sup-act{justify-content:space-between;margin-top:6px;gap:6px}
.dsrch .sup-filter{width:210px}
table.dt tr.man td.t{cursor:default}
table.dt .mnm{width:100%}
table.dt .mnm.none{border-color:var(--bad)}

.dpickh{gap:10px;flex-wrap:nowrap;align-items:center}
.dpickh h3{margin:0;flex:none}
.dpickh #secbar{flex:1;min-width:0;display:flex;justify-content:flex-end}
.dpickh .secbar{margin:0!important;justify-content:flex-end;flex-wrap:wrap}
.dpickh .secbar .chips{flex:none;justify-content:flex-end}
.dfoot{gap:10px;align-items:center;flex-wrap:nowrap}
.dfoot .dcount{white-space:nowrap}
body.desk .btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}

table.dt tr.sechd{display:table-row}
table.dt tr.sechd td{display:table-cell}
table.dt tr.sechd td span{display:inline}
/* telefon */
.top .tt{flex:1;min-width:0}
.top .tt .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top #bHist{flex:none;padding:7px 11px;font-size:17px;line-height:1}
.mfoot{justify-content:space-between;margin-top:6px}

/* Excel'dan kelgan, tekshirilishi kerak qatorlar */
table.dt tr.ln.chk td{background:var(--warn-t)}

.xchk .btn.xs{height:auto;padding:2px 8px;font-size:12px}
.phd.repl{background:var(--warn-t);color:var(--warn);font-weight:600}

      root.querySelectorAll("[data-q]").forEach(function (b) { b.onclick = function () { qi.value = b.dataset.q; showRes(); }; });
      qi.onkeydown = function (e) { if (e.key === "Enter") ok(); };
      $("pOk").onclick = ok;
      if ($("pCancel")) $("pCancel").onclick = function () { closeSheet(); $("q").focus(); };
      if ($("pDel")) $("pDel").onclick = function () { S.lines = S.lines.filter(function (x) { return x.id !== l.id; }); save(); closeSheet(); renderList(); };
      if (!it || !sizes.length || l.size) { if (!l.qty) setTimeout(function () { qi.focus(); }, 60); }
    }
    function qtyVal() { var q = $("pQty"); return q ? calcQty(q.value) : l.qty; }
    function ok() {
      l.qty = qtyVal();
      var qv = $("pQty") ? $("pQty").value.trim() : ""; l.expr = isExpr(qv) ? qv : "";
      if (!l.known) { l.name = ($("pText").value || "").trim(); if (l.name.length < 2) return; }
      if (!l.qty) { $("pErr").textContent = T("needQty"); $("pQty").focus(); return; }
      closeSheet();
      if (isNew) { addLine(l); $("q").focus(); }
      else { var i = S.lines.findIndex(function (x) { return x.id === l.id; }); if (i >= 0) S.lines[i] = l; S.fresh = l.id; save(); renderList(); }
    }
    sheet("", mount);
  }
  function openCatalog(cat) {
    var html = "", items = E.items;
    if (!cat) {
      html = '<h3>' + esc(T("catalog")) + '</h3><input class="inp" id="cS" placeholder="' + esc(T("search")) + '" style="margin:8px 0">';
      html += '<div id="cList">' + E.cats.map(function (c) { var n = items.filter(function (i) { return i.cat === c[0]; }).length; return '<button class="cat" data-c="' + c[0] + '">' + esc(S.lang === "ru" ? c[2] : c[1]) + "<span>" + n + " ›</span></button>"; }).join("") + "</div>";
    } else {
      var c = E.cats.find(function (x) { return x[0] === cat; });
      html = '<div class="row"><button class="link" id="cBack" style="margin-left:0">‹ ' + esc(T("back")) + '</button></div><h3>' + esc(S.lang === "ru" ? c[2] : c[1]) + "</h3>";
      html += items.filter(function (i) { return i.cat === cat; }).map(function (i) { return '<button class="cat" data-i="' + i.i + '">' + esc(i.name) + "<span>›</span></button>"; }).join("");
    }
    sheet(html, function (root) {
      root.querySelectorAll("[data-c]").forEach(function (b) { b.onclick = function () { openCatalog(b.dataset.c); }; });
      bindItems(root);
      var back = $("cBack"); if (back) back.onclick = function () { openCatalog(); };
      var cs = $("cS");
      if (cs) cs.oninput = function () {
        var v = cs.value.trim();
        if (v.length < 2) { openCatalog(); setTimeout(function () { var n = $("cS"); n.value = v; n.focus(); }, 0); return; }
        $("cList").innerHTML = E.suggest(v, 12).filter(function (r) { return r.score >= 0.55; }).map(function (r) { return '<button class="cat" data-i="' + r.it.i + '">' + esc(r.it.name) + "<span>›</span></button>"; }).join("");
        bindItems(root);
      };
    });
    function bindItems(root) {
      root.querySelectorAll("[data-i]").forEach(function (b) {
        b.onclick = function () { var it = E.items[Number(b.dataset.i)]; openPicker({ name: it.name, vars: it.vars.map(function () { return ""; }), size: "", qty: null, unit: it.unit, raw: "", known: true, cat: it.cat, ii: it.i }, true); };
      });
    }
  }
  function openPaste() {
    sheet('<h3>' + esc(T("pasteT")) + '</h3><div class="d">' + esc(T("pasteD")) + '</div><textarea class="inp" id="pT" placeholder="troynik 25 10 ta\nkran 1/2 5 ta\n..."></textarea><div class="acts"><button class="btn" id="pC">' + esc(T("cancel")) + '</button><button class="btn pri" id="pA">' + esc(T("pasteBtn")) + "</button></div>", function () {
      $("pC").onclick = closeSheet;
      $("pA").onclick = function () { var v = $("pT").value; closeSheet(); if (v.trim()) addMany(v); };
      setTimeout(function () { $("pT").focus(); }, 60);
    });
  }
  function newList() {
    var go = function () { S.listId = uid(); S.lines = []; S.secs = []; S.cur = ""; S.object = ""; S.note = ""; S.view = "list"; save(); shell(); $("obj").focus(); };
    if (!S.lines.length) return go();
    confirmSheet(T("newListQ"), go, T("newList"));
  }
  function openList(x) {
    S.listId = x.id; S.object = x.object || ""; S.note = x.note || ""; S.lines = (x.lines || []).map(function (l) { return Object.assign({}, l); });
    S.secs = (x.secs || []).slice(); S.cur = ""; S.view = "list"; save(); closeSheet(); shell();
  }
  function listsHtml() {
    var dt = function (t) { return new Date(t).toLocaleDateString(S.lang === "ru" ? "ru-RU" : "uz-UZ"); };
    var drafts = S.lists.filter(function (x) { return x.id !== S.listId; });
    var h = '<div class="lbl grp">' + esc(T("drafts")) + "</div>";
    if (!drafts.length) h += '<div class="d">' + esc(T("noHistory")) + "</div>";
    h += drafts.map(function (x) {
      return '<div class="hist"><div class="t"><b>' + esc(x.object || T("noObject")) + "</b>" + esc(dt(x.at)) + " · " + (x.lines || []).length + " " + esc(T("items")) + (x.secs && x.secs.length ? " · " + x.secs.length + " " + esc(T("secs")) : "") + '</div><button class="btn sm" data-d="' + x.id + '">' + esc(T("open")) + '</button><button class="btn sm ghost" data-x="' + x.id + '" aria-label="' + esc(T("del")) + '">✕</button></div>';
    }).join("");
    h += '<div class="lbl grp">' + esc(T("sentLists")) + "</div>";
    if (!S.hist.length) h += '<div class="d">' + esc(T("noHistory")) + "</div>";
    h += S.hist.map(function (x, i) {
      return '<div class="hist"><div class="t"><b>№' + esc(x.num) + " · " + esc(dt(x.at)) + '</b>' + esc(x.object || "") + " · " + x.lines.length + " " + esc(T("items")) + '</div><button class="btn sm" data-h="' + i + '">' + esc(T("open")) + "</button></div>";
    }).join("");
    return h;
  }
  function bindLists(root, again) {
    root.querySelectorAll("[data-d]").forEach(function (b) { b.onclick = function () { save(); var x = S.lists.find(function (y) { return y.id === b.dataset.d; }); if (x) openList(x); }; });
    root.querySelectorAll("[data-x]").forEach(function (b) { b.onclick = function () { S.lists = S.lists.filter(function (y) { return y.id !== b.dataset.x; }); store(K.lists, S.lists); again(); }; });
    // yuborilgan ro'yxat — nusxa sifatida yangi ro'yxat bo'lib ochiladi (o'zgartirib, qayta yuborish mumkin)
    root.querySelectorAll("[data-h]").forEach(function (b) {
      b.onclick = function () {
        var x = S.hist[Number(b.dataset.h)]; save();
        openList({ id: uid(), object: x.object || "", note: "", lines: x.lines.map(function (l) { return Object.assign({}, l, { id: uid() }); }), secs: x.secs || [] });
      };
    });
  }
  function renderLists() { var d = $("dlists"); if (!d) return; d.innerHTML = listsHtml(); bindLists(d, renderLists); }
  function openHistory() {
    sheet('<h3>' + esc(T("myLists")) + "</h3>" + listsHtml() + '<div class="acts"><button class="btn" id="hC">' + esc(T("back")) + "</button></div>", function (root) {
      $("hC").onclick = closeSheet; bindLists(root, openHistory);
    });
  }

  // ---------- yuborish ----------
  function whoNow() { return S.me ? S.me : S.who; }
  function listText(num) {
    var w = whoNow(), out = [T("txtList") + (num ? " №" + num : "")];
    out.push(T("txtUsta") + ": " + String(w.name || "").trim() + (w.phone ? ", " + String(w.phone).trim() : ""));
    if (S.object.trim()) out.push(T("txtObj") + ": " + S.object.trim());
    out.push("");
    totals().forEach(function (l, i) { out.push((i + 1) + ". " + lineLabel(l) + " — " + fmtQ(l.qty) + " " + (l.unit || "")); });
    if (S.note.trim()) { out.push(""); out.push(T("txtNote") + ": " + S.note.trim()); }
    return out.join("\n");
  }
  function send() {
    if (S.sending) return;
    var d = digits(S.who.phone);
    if (!S.me && (S.who.name.trim().length < 2 || d.length < 9)) { S.editWho = true; renderWho(); toast(d.length && d.length < 9 ? T("errPhone") : T("needWho")); (S.who.name.trim().length < 2 ? $("wName") : $("wPhone")).focus(); return; }
    if (!S.lines.length) { toast(T("needLines")); $("q").focus(); return; }
    var unchk = S.lines.filter(function (l) { return l.chk || l.miss; });
    if (unchk.length && isDesk()) {
      toast(T("xlsUnchecked").replace("{n}", unchk.length));
      if (S.view === "total") { S.view = "list"; renderSecs(); renderList(); }
      var ue = document.querySelector('.ln[data-id="' + unchk[0].id + '"]'); if (ue && ue.scrollIntoView) ue.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }
    var noName = S.lines.find(function (l) { return l.manual && !String(l.name || "").trim(); });
    if (noName && isDesk()) { toast(T("needName")); if (S.view === "total") { S.view = "list"; renderSecs(); renderList(); } var nf = document.querySelector('.ln[data-id="' + noName.id + '"] .mnm'); if (nf) nf.focus(); return; }
    var noQ = S.lines.find(function (l) { return !l.qty; });
    if (noQ) {
      toast(T("needQty"));
      if (isDesk()) { if (S.view === "total") { S.view = "list"; renderSecs(); renderList(); } var f = document.querySelector('.ln[data-id="' + noQ.id + '"] .qin'); if (f) { f.focus(); return; } }
      openPicker(noQ, false); return;
    }
    if (PREVIEW) { sent("—", listText("")); return; }
    S.sending = true; renderSend();
    // bizga — jami (hamma bo'limlar qo'shilgan); bo'limlar faqat ustaning o'zida qoladi
    var payload = { key: S.me ? S.key : "", name: S.who.name.trim(), phone: S.who.phone.trim(), object: S.object.trim(), note: S.note.trim(), lines: totals().map(function (l) {
      return { name: l.name, vars: (l.vars || []).filter(Boolean).join(" "), size: l.size || "", qty: String(l.qty), unit: l.unit || "", raw: l.raw || l.src || "", known: !!l.known, cat: l.cat || "", pid: l.pid || "" };
    }) };
    fetch(CFG.url + "/rest/v1/rpc/usta_submit", {
      method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + CFG.key },
      body: JSON.stringify({ p: payload }),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
      S.sending = false;
      if (!x.ok) { var m = String((x.j && x.j.message) || ""); renderSend(); if (/usta_key/.test(m)) { keyLost(); return; } toast(/usta_rate/.test(m) ? T("errRate") : /usta_phone/.test(m) ? T("errPhone") : T("err")); return; }
      var num = x.j && x.j.num;
      var text = listText(num);
      S.hist.unshift({ num: num, at: Date.now(), object: S.object.trim(), lines: S.lines.map(function (l) { return Object.assign({}, l); }), secs: S.secs.slice() });
      S.hist = S.hist.slice(0, 20); store(K.hist, S.hist);
      S.editWho = false;
      // yuborilgan ro'yxat «saqlanganlar»dan chiqadi (u endi «yuborilganlar»da)
      S.lists = S.lists.filter(function (y) { return y.id !== S.listId; }); store(K.lists, S.lists);
      S.listId = uid(); S.lines = []; S.secs = []; S.cur = ""; S.view = "list"; S.note = ""; S.object = ""; save();
      shell();
      sent(num, text);
    }).catch(function () { S.sending = false; renderSend(); toast(T("err")); });
  }
  function sent(num, text) {
    if (PREVIEW) {
      sheet('<h3>' + esc(T("previewSentT")) + '</h3><div class="d">' + esc(T("previewSentD")) + '</div><textarea class="inp" readonly style="min-height:220px;font-size:13px">' + esc(text) + '</textarea><div class="acts"><button class="btn pri" id="pvOk">OK</button></div>', function () { $("pvOk").onclick = closeSheet; });
      return;
    }
    sheet('<div class="center"><div class="ok-ic">✓</div><h3>' + esc(T("sentT")) + '</h3><div class="d" style="margin:0">' + esc(T("sentD")) + '</div><div class="num">№' + esc(num) + "</div></div>" +
      '<button class="btn pri big" id="sTg">' + esc(T("share")) + '</button><div class="acts"><button class="btn" id="sCopy">' + esc(T("copy")) + '</button><button class="btn" id="sNew">' + esc(T("newList")) + "</button></div>", function () {
      $("sTg").onclick = function () {
        if (navigator.share) { navigator.share({ text: text }).catch(function () {}); return; }
        window.open("https://t.me/share/url?url=" + encodeURIComponent(text), "_blank");
      };
      $("sCopy").onclick = function () {
        var done = function () { toast(T("copied")); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); }); else { fallbackCopy(text); done(); }
      };
      $("sNew").onclick = function () { closeSheet(); $("q").focus(); };
    });
  }
  function fallbackCopy(t) { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (e) {} a.remove(); }

  function keyLost() { S.me = null; S.keyBad = true; S.key = ""; store(K.key, ""); if (!S.who.name || !S.who.phone) S.editWho = true; renderWho(); toast(T("keyBad")); }
  function checkKey() {
    if (!S.key) return;
    fetch(CFG.url + "/rest/v1/rpc/usta_me", {
      method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + CFG.key },
      body: JSON.stringify({ p_key: S.key }),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
      if (x.ok && x.j && x.j.name) { S.me = { name: x.j.name, phone: x.j.phone || "" }; S.keyBad = false; store(K.key, S.key); S.editWho = false; renderWho(); loadBase(); return; }
      if (/usta_key/.test(String((x.j && x.j.message) || ""))) keyLost();
    }).catch(function () { /* internet yo'q — keyin yuborishda tekshiriladi */ if (S.key) { S.me = S.me || null; } });
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && $("sheetBg")) { closeSheet(); var q = $("q"); if (q && isDesk()) q.focus(); }
  });
  shell();
  checkKey();
})();
</script>
</body></html>
